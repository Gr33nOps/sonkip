name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "app/**"
      - "static/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Verify downloader behavior
        run: |
          python -m pip install -r requirements.txt pytest httpx
          python -m pytest -q
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Build bundled JavaScript runtime
        run: |
          sdkmanager "ndk;28.2.13676358"
          python android/build_runtime.py
      - name: Build installable APK
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Verify token and website interactions
        run: node --test tests/*.test.cjs
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sonkip-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sonkip-android
          path: sonkip-android.apk
      # Build artifacts are not releases. Publish only the exact APK which has
      # passed the real-device playlist download and playback checks.

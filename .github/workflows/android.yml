name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "app/**"
      - "static/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Verify downloader behavior
        run: |
          python -m pip install -r requirements.txt pytest httpx
          python -m pytest -q
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build installable APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sonkip-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sonkip-android
          path: sonkip-android.apk
      - name: Publish Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest sonkip-android.apk --clobber
          else
            gh release create android-latest sonkip-android.apk \
              --title "Sonkip for Android" \
              --notes "Installable Android APK. Sonkip runs locally on your device and stores its library in app-private storage." \
              --latest=false
          fi

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify platform downloads
        shell: bash
        run: |
          node --test tests/platform_detection.test.cjs
          node --test tests/clipboard.test.cjs
          node --test tests/playback.test.cjs
          bash -n install.sh
      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site/static
          cp static/index.html _site/index.html
          cp static/style.css static/app.js static/platform.js static/favicon.svg _site/static/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
